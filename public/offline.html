<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b5b3b" />
    <title>연결 없음 - 군 생활 도우미</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR',
          'Malgun Gothic', sans-serif;
        background: #f4f5f2;
        color: #1f2a1f;
        text-align: center;
      }
      main {
        padding: 24px;
      }
      h1 {
        font-size: 20px;
      }
      p {
        color: #5c6b5c;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        background: #3b5b3b;
        color: #fff;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>일정과 근무표는 연결되어야 볼 수 있어요.<br />연결을 확인한 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
